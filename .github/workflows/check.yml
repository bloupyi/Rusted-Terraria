name: check
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component clippy
      - name: ALSA headers for cpal
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: No game files or decompiled sources in the tree or history
        shell: bash
        run: python3 tools/check_public_tree.py && python3 tools/check_public_tree.py --history
